<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="utf-8" />
    <title>Hireschema CV score</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <p class="kicker">India only · file not stored</p>
    <h1>Score this CV</h1>
    <p class="lede">
      Public Hireschema review. Not Naukri login. Not a recruiter tool.
    </p>
    <input id="file" type="file" accept=".pdf,.doc,.docx,application/pdf" />
    <button id="run" type="button">Review</button>
    <p id="status" class="status"></p>
    <pre id="out" hidden></pre>
    <p class="links">
      <a href="https://hireschema.com/reviewmycv" target="_blank" rel="noreferrer">Full review page</a>
      ·
      <a href="https://hireschema.com/alternatives/naukri" target="_blank" rel="noreferrer">Naukri alternative</a>
    </p>
    <script src="popup.js"></script>
  </body>
</html>
