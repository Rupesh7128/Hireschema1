<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Hireschema</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>Hireschema</h1>
      <p id="status-line">Checking…</p>
    </header>

    <section class="actions">
      <button id="btn-save" type="button">Save this job</button>
      <button id="btn-prepare-kit" type="button" class="secondary">Save + prepare kit</button>
      <button id="btn-tracker" type="button" class="secondary">Open tracker</button>
      <button id="btn-connect" type="button" class="secondary">Sign in</button>
      <button id="btn-disconnect" type="button" class="ghost hidden">Disconnect</button>
    </section>

    <label class="toggle">
      <input id="auto-kit" type="checkbox" checked />
      Also prepare kit when I save
    </label>

    <p id="message" class="message" hidden></p>

    <details class="advanced">
      <summary>Settings</summary>
      <label>
        API base
        <input id="api-base" type="url" placeholder="https://hireschema1.vercel.app/hireloop-api" />
      </label>
      <label>
        App origin
        <input id="app-origin" type="url" placeholder="https://hireschema1.vercel.app" />
      </label>
      <button id="btn-save-settings" type="button" class="secondary">Save settings</button>
    </details>

    <script src="popup.js"></script>
  </body>
</html>
